<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spikelist — Coming Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0E1116;
    --surface: #161B22;
    --border: #2A313C;
    --accent: #FF5E3A;
    --accent-2: #5EEAD4;
    --text: #E6EDF3;
    --text-muted: #8B949E;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Inter', sans-serif;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html{ scroll-behavior:smooth; }

  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    line-height:1.5;
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
  }

  /* faint graph-paper grid, on brand for a chart-driven product */
  .grid-bg{
    position:fixed;
    inset:0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 48px 48px;
    opacity:0.18;
    pointer-events:none;
    z-index:0;
    mask-image: radial-gradient(ellipse at 50% 0%, rgba(0,0,0,0.9) 0%, transparent 70%);
  }

  .wrap{
    position:relative;
    z-index:1;
    max-width:1180px;
    margin:0 auto;
    padding:0 32px;
  }

  /* ---------- nav ---------- */
  nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:32px 0;
  }

  .logo{
    font-family:var(--mono);
    font-weight:700;
    font-size:18px;
    letter-spacing:0.08em;
  }

  .logo .cursor{
    color:var(--accent);
    animation: blink 1.1s steps(1) infinite;
  }

  @keyframes blink{ 50%{ opacity:0; } }

  .status{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:0.12em;
    color:var(--text-muted);
    text-transform:uppercase;
  }

  .dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 0 0 rgba(255,94,58,0.6);
    animation: pulse 1.8s ease-out infinite;
  }

  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(255,94,58,0.55); }
    70%{ box-shadow:0 0 0 8px rgba(255,94,58,0); }
    100%{ box-shadow:0 0 0 0 rgba(255,94,58,0); }
  }

  /* ---------- hero ---------- */
  .hero{
    display:grid;
    grid-template-columns: 1.05fr 1fr;
    gap:56px;
    align-items:center;
    padding: 56px 0 88px;
  }

  .eyebrow{
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--accent-2);
    margin-bottom:22px;
  }

  h1{
    font-family:var(--mono);
    font-weight:700;
    font-size:clamp(48px, 7vw, 84px);
    line-height:1.02;
    letter-spacing:-0.02em;
    margin-bottom:24px;
  }

  h1 span{ color: var(--text-muted); }

  .sub{
    font-size:17px;
    color:var(--text-muted);
    max-width:480px;
    margin-bottom:36px;
  }

  .sub strong{ color:var(--text); font-weight:600; }

  form{
    display:flex;
    gap:10px;
    max-width:440px;
    flex-wrap:wrap;
  }

  input[type="email"]{
    flex:1;
    min-width:0;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:6px;
    padding:14px 16px;
    color:var(--text);
    font-family:var(--sans);
    font-size:14px;
    outline:none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }

  input[type="email"]::placeholder{ color:var(--text-muted); }

  input[type="email"]:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(255,94,58,0.15);
  }

  button{
    background:var(--accent);
    color:#0E1116;
    border:none;
    border-radius:6px;
    padding:14px 22px;
    font-family:var(--mono);
    font-weight:700;
    font-size:13px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    cursor:pointer;
    transition: transform .12s ease, background .15s ease;
    white-space:nowrap;
  }

  button:hover{ background:#ff7a5c; transform:translateY(-1px); }
  button:active{ transform:translateY(0); }

  .form-msg{
    margin-top:14px;
    font-family:var(--mono);
    font-size:13px;
    color:var(--accent-2);
    min-height:18px;
  }

  /* ---------- spike chart panel ---------- */
  .chart-panel{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:20px;
    position:relative;
  }

  .chart-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--text-muted);
    margin-bottom:8px;
  }

  .chart-head .live{
    color:var(--accent-2);
  }

  svg.chart{ width:100%; height:auto; display:block; }

  .chart-axis text{
    font-family:var(--mono);
    font-size:10px;
    fill:var(--text-muted);
  }

  .spike-line{
    fill:none;
    stroke:var(--accent);
    stroke-width:2.5;
    stroke-linecap:round;
    stroke-linejoin:round;
    stroke-dasharray: 1000;
    stroke-dashoffset: 1000;
    animation: draw 2.2s ease-out forwards;
  }

  @keyframes draw{ to{ stroke-dashoffset:0; } }

  .peak-marker{
    fill:var(--accent);
    opacity:0;
    animation: pop 0.4s ease-out 1.9s forwards;
  }

  @keyframes pop{
    from{ opacity:0; transform:scale(0); transform-origin: 290px 46px; }
    to{ opacity:1; transform:scale(1); transform-origin: 290px 46px; }
  }

  .peak-label{
    font-family:var(--mono);
    font-size:11px;
    fill:var(--accent);
    opacity:0;
    animation: pop 0.4s ease-out 2.1s forwards;
  }

  /* ---------- spike log ---------- */
  .spike-log{
    border-top:1px solid var(--border);
    padding:64px 0;
  }

  .spike-log .eyebrow{ margin-bottom:28px; }

  .log-list{
    display:flex;
    flex-direction:column;
  }

  .log-row{
    display:grid;
    grid-template-columns: 110px 1fr 110px;
    align-items:center;
    gap:24px;
    padding:16px 0;
    border-bottom:1px solid var(--border);
    font-family:var(--mono);
    font-size:14px;
  }

  .log-row:last-child{ border-bottom:none; }

  .log-id{ color:var(--text-muted); }

  .log-desc{ color:var(--text); font-family:var(--sans); font-size:15px; }

  .log-status{
    justify-self:end;
    font-size:11px;
    letter-spacing:0.08em;
    padding:5px 10px;
    border-radius:4px;
    text-align:center;
  }

  .log-status.done{
    color:var(--accent-2);
    background:rgba(94,234,212,0.1);
    border:1px solid rgba(94,234,212,0.25);
  }

  .log-status.progress{
    color:var(--accent);
    background:rgba(255,94,58,0.1);
    border:1px solid rgba(255,94,58,0.25);
    animation: glow 1.8s ease-in-out infinite;
  }

  @keyframes glow{
    0%,100%{ box-shadow:0 0 0 0 rgba(255,94,58,0); }
    50%{ box-shadow:0 0 12px 0 rgba(255,94,58,0.25); }
  }

  /* ---------- footer ---------- */
  footer{
    border-top:1px solid var(--border);
    padding:28px 0 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-family:var(--mono);
    font-size:12px;
    color:var(--text-muted);
    letter-spacing:0.04em;
  }

  footer a{ color:var(--text-muted); text-decoration:none; }
  footer a:hover{ color:var(--accent-2); }

  .footer-links{ display:flex; gap:20px; }

  /* ---------- responsive ---------- */
  @media (max-width: 860px){
    .hero{ grid-template-columns: 1fr; gap:40px; padding:32px 0 56px; }
    .wrap{ padding:0 20px; }
    h1{ font-size:clamp(40px, 12vw, 64px); }
    .log-row{ grid-template-columns: 90px 1fr; }
    .log-status{ grid-column: 1 / -1; justify-self:start; margin-top:4px; }
    footer{ flex-direction:column; gap:14px; align-items:flex-start; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    .spike-line{ stroke-dashoffset:0; }
    .peak-marker, .peak-label{ opacity:1; }
  }
</style>
</head>
<body>

  <div class="grid-bg"></div>

  <div class="wrap">

    <nav>
      <div class="logo">SPIKELIST<span class="cursor">_</span></div>
      <div class="status"><span class="dot"></span>Launching soon</div>
    </nav>

    <main class="hero">
      <div class="hero-text">        
        <h1>Coming<br><span>soon.</span></h1>
        
        <p class="form-msg" id="form-msg"></p>
      </div>

      
    </main>

    

    <footer>
      <span>© 2024 Spikelist. All rights reserved.</span>
    </footer>

  </div>
</body>
</html>
